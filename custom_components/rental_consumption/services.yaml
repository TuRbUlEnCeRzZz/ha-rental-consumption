add_period:
  name: Add a period
  description: Add water, hot-water, heating or electricity consumption over an inclusive historical period.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    consumption_type:
      name: Type
      required: true
      selector:
        select:
          options:
            - label: Total water
              value: water
            - label: Hot water
              value: hot_water
            - label: Heating
              value: heating
            - label: Electricity
              value: electricity
    start_date:
      name: Start
      required: true
      selector:
        date:
    end_date:
      name: End
      required: true
      selector:
        date:
    value:
      name: Consumption
      required: true
      selector:
        number:
          min: 0.001
          max: 1000000000
          step: any
          mode: box
    cost:
      name: Total cost
      description: Optional total cost for this billing period.
      required: false
      selector:
        number:
          min: 0
          max: 1000000000
          step: any
          mode: box
    note:
      name: Note
      required: false
      selector:
        text:
          multiline: true

