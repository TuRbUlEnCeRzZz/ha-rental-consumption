            - {label: Eau chaude, value: hot_water}
            - {label: Chauffage, value: heating}
            - {label: Électricité réseau, value: electricity}
            - {label: Fourniture PV, value: pv_electricity}
    start_date: {name: Début, required: true, selector: {date: {}}}
    end_date: {name: Fin, required: true, selector: {date: {}}}
    value: {name: Consommation totale, required: true, selector: {number: {min: 0.001, max: 1000000000, step: any, mode: box}}}
    cost: {name: Coût total, required: false, selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}}
    provider: {name: GRD / fournisseur, required: false, selector: {text: {}}}
    tariff_mode:
      name: Tarif électrique
      required: false
      selector:
        select:
          options:
            - {label: Unitaire, value: single}
            - {label: On-peak / Off-peak, value: peak_offpeak}
    peak_value: {name: Consommation on-peak, required: false, selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}}
    offpeak_value: {name: Consommation off-peak, required: false, selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}}
    peak_cost: {name: Coût on-peak, required: false, selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}}
    offpeak_cost: {name: Coût off-peak, required: false, selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}}
    note: {name: Note, required: false, selector: {text: {multiline: true}}}

delete_period:
  name: Supprimer une période
  description: Supprime une période et reconstruit les statistiques Recorder.
  fields:
    config_entry_id: {name: Identifiant de l'entrée, required: true, selector: {text: {}}}
    period_id: {name: Identifiant de la période, required: true, selector: {text: {}}}

rebuild_statistics:
  name: Reconstruire les statistiques
  description: Reconstruit les statistiques historiques Recorder.
  fields:
    config_entry_id: {name: Identifiant de l'entrée, required: true, selector: {text: {}}}

sync_export:
  name: Reconstruire l'export externe
  description: Supprime puis réécrit les séries de cet appartement sur une destination compatible avec la suppression sûre.
  fields:
    config_entry_id: {name: Identifiant de l'entrée, required: true, selector: {text: {}}}
