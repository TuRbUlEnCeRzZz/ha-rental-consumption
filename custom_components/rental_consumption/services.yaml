add_period:
  name: Ajouter une période
  description: Ajoute une consommation historique.
  fields:
    config_entry_id:
      name: Identifiant de l'entrée
      required: true
      selector: {text: {}}
    consumption_type:
      name: Type
      required: true
      selector:
        select:
          options:
            - {label: Eau totale, value: water}
            - {label: Eau chaude, value: hot_water}
            - {label: Chauffage, value: heating}
            - {label: Électricité réseau, value: electricity}
            - {label: Fourniture PV, value: pv_electricity}
    start_date: {name: Début, required: true, selector: {date: {}}}
    end_date: {name: Fin, required: true, selector: {date: {}}}
    value:
      name: Consommation totale
      required: true
      selector: {number: {min: 0.001, max: 1000000000, step: any, mode: box}}
    cost:
      name: Coût total
      required: false
      selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}
    provider:
      name: GRD / fournisseur
      description: Fournisseur ou gestionnaire de réseau associé à cette période.
      required: false
      selector: {text: {}}
    tariff_mode:
      name: Tarif électrique
      required: false
      selector:
        select:
          options:
            - {label: Unitaire, value: single}
            - {label: On-peak / Off-peak, value: peak_offpeak}
    peak_value:
      name: Consommation on-peak
      required: false
      selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}
    offpeak_value:
      name: Consommation off-peak
      required: false
      selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}
    peak_cost:
      name: Coût on-peak
      required: false
      selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}
    offpeak_cost:
      name: Coût off-peak
      required: false
      selector: {number: {min: 0, max: 1000000000, step: any, mode: box}}
    note:
      name: Note
      required: false
      selector: {text: {multiline: true}}

